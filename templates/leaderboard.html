<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - JSL Alphabet Adventure</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .leaderboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 20px 40px;
        }
        
        .leaderboard-header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease-out;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .leaderboard-title {
            font-size: 4rem;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 5px 20px rgba(0,0,0,0.3);
            animation: pulse 3s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .stat-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stat-label {
            color: #666;
            font-size: 1rem;
            margin-top: 5px;
        }
        
        .mode-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .tab-button {
            padding: 12px 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab-button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .tab-button.active {
            background: white;
            color: #667eea;
            border-color: white;
            box-shadow: 0 5px 20px rgba(255,255,255,0.4);
        }
        
        .leaderboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 25px;
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .mode-leaderboard {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: all 0.3s;
            display: none;
        }
        
        .mode-leaderboard.active {
            display: block;
        }
        
        .mode-leaderboard:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
        }
        
        .mode-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 3px solid #f0f0f0;
        }
        
        .mode-header h3 {
            font-size: 2rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .high-score-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
            animation: glow 2s infinite;
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4); }
            50% { box-shadow: 0 5px 25px rgba(255, 215, 0, 0.8); }
        }
        
        .score-entry {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f5f5f5, #fafafa);
            border-radius: 15px;
            transition: all 0.3s;
            border-left: 5px solid transparent;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .score-entry:hover {
            background: linear-gradient(135deg, #e0e0e0, #efefef);
            transform: translateX(10px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .score-entry.top-score {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border-left-color: #ff6b00;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
            animation: topScorePulse 2s infinite;
        }
        
        @keyframes topScorePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        .score-entry.second-place {
            background: linear-gradient(135deg, #e0e0e0, #f0f0f0);
            border-left-color: #c0c0c0;
        }
        
        .score-entry.third-place {
            background: linear-gradient(135deg, #cd7f32, #d4926e);
            border-left-color: #8b4513;
        }
        
        .rank {
            font-size: 2rem;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }
        
        .rank.gold { filter: drop-shadow(0 0 10px #ffd700); }
        .rank.silver { filter: drop-shadow(0 0 10px #c0c0c0); }
        .rank.bronze { filter: drop-shadow(0 0 10px #cd7f32); }
        
        .score-info {
            flex: 1;
            margin: 0 15px;
        }
        
        .score-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .score-percentage {
            display: inline-block;
            padding: 3px 10px;
            background: #667eea;
            color: white;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-left: 10px;
        }
        
        .score-date {
            font-size: 0.85rem;
            color: #999;
        }
        
        .streak-badge {
            display: inline-block;
            padding: 3px 10px;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: white;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-left: 8px;
            animation: flicker 1.5s infinite;
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .no-scores {
            text-align: center;
            color: #999;
            padding: 60px 20px;
            font-style: italic;
            font-size: 1.2rem;
        }
        
        .no-scores-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 15px 35px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .refresh-btn:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }
        
        .empty-state-icon {
            font-size: 6rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @media (max-width: 768px) {
            .leaderboard-title {
                font-size: 2.5rem;
            }
            .leaderboard-grid {
                grid-template-columns: 1fr;
            }
            .stats-overview {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <a href="/" class="home-btn">🏠 Home</a>
    <button class="refresh-btn" onclick="loadLeaderboard()" title="Refresh">🔄</button>
    
    <div class="leaderboard-container">
        <div class="leaderboard-header">
            <h1 class="leaderboard-title">🏆 LEADERBOARD 🏆</h1>
            <p style="color: white; font-size: 1.3rem; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">
                Top Scores & Champions
            </p>
        </div>

        <div class="stats-overview" id="statsOverview">
            <div class="stat-card">
                <div class="stat-icon">🎮</div>
                <div class="stat-value" id="totalGames">0</div>
                <div class="stat-label">Total Games</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-value" id="highestScore">0</div>
                <div class="stat-label">Highest Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-value" id="perfectScores">0</div>
                <div class="stat-label">Perfect Scores</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎯</div>
                <div class="stat-value" id="avgAccuracy">0%</div>
                <div class="stat-label">Avg Accuracy</div>
            </div>
        </div>

        <div class="mode-tabs">
            <button class="tab-button active" onclick="filterMode('all')">📊 All Modes</button>
            <button class="tab-button" onclick="filterMode('practice')">⚡ Practice</button>
            <button class="tab-button" onclick="filterMode('challenge')">🏆 Challenge</button>
            <button class="tab-button" onclick="filterMode('memory')">🧠 Memory</button>
            <button class="tab-button" onclick="filterMode('speed')">⚡⚡ Speed</button>
            <button class="tab-button" onclick="filterMode('survival')">❤️ Survival</button>
        </div>

        <div class="leaderboard-grid" id="leaderboardGrid"></div>
    </div>

    <script>
        let currentFilter = 'all';

        async function loadLeaderboard() {
            try {
                const response = await fetch('/api/leaderboard');
                const data = await response.json();

                calculateStats(data);
                displayLeaderboards(data);
            } catch (error) {
                console.error('Error loading leaderboard:', error);
            }
        }

        function calculateStats(data) {
            let totalGames = 0;
            let highestScore = 0;
            let perfectScores = 0;
            let totalAccuracy = 0;
            let accuracyCount = 0;

            Object.values(data).forEach(modeScores => {
                modeScores.forEach(entry => {
                    totalGames++;
                    if (entry.score > highestScore) {
                        highestScore = entry.score;
                    }
                    if (entry.percentage === 100) {
                        perfectScores++;
                    }
                    if (entry.percentage) {
                        totalAccuracy += entry.percentage;
                        accuracyCount++;
                    }
                });
            });

            document.getElementById('totalGames').textContent = totalGames;
            document.getElementById('highestScore').textContent = highestScore;
            document.getElementById('perfectScores').textContent = perfectScores;
            document.getElementById('avgAccuracy').textContent = 
                accuracyCount > 0 ? Math.round(totalAccuracy / accuracyCount) + '%' : '0%';
        }

        function displayLeaderboards(data) {
            const modes = {
                'practice': { name: '⚡ Practice Mode', id: 'practice' },
                'challenge': { name: '🏆 Challenge Mode', id: 'challenge' },
                'memory': { name: '🧠 Memory Mode', id: 'memory' },
                'speed': { name: '⚡⚡ Speed Run', id: 'speed' },
                'survival': { name: '❤️ Survival Mode', id: 'survival' },
                'speed_blitz': { name: '🚀 Speed Blitz', id: 'speed_blitz' }
            };

            const grid = document.getElementById('leaderboardGrid');
            grid.innerHTML = '';

            Object.entries(modes).forEach(([key, mode]) => {
                const scores = data[key] || [];
                const board = createLeaderboardCard(mode, scores);
                grid.appendChild(board);
            });

            filterMode(currentFilter);
        }

        function createLeaderboardCard(mode, scores) {
            const card = document.createElement('div');
            card.className = 'mode-leaderboard';
            card.dataset.mode = mode.id;

            const highScore = scores.length > 0 ? scores[0] : null;
            let highScoreText = 'No scores yet';
            
            if (highScore) {
                if (mode.id === 'survival') {
                    highScoreText = `${highScore.score} correct`;
                } else {
                    highScoreText = `${highScore.score}/${highScore.total} (${highScore.percentage}%)`;
                }
            }

            card.innerHTML = `
                <div class="mode-header">
                    <h3>${mode.name}</h3>
                    <div class="high-score-badge">${highScoreText}</div>
                </div>
                <div class="scores-list">
                    ${scores.length === 0 ? `
                        <div class="no-scores">
                            <div class="no-scores-icon">🎯</div>
                            <div>No scores yet! Be the first!</div>
                        </div>
                    ` : scores.slice(0, 10).map((entry, index) => createScoreEntry(entry, index, mode.id)).join('')}
                </div>
            `;

            return card;
        }

        function createScoreEntry(entry, index, modeId) {
            const rank = index + 1;
            const medals = ['🥇', '🥈', '🥉'];
            const rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
            const entryClass = rank === 1 ? 'top-score' : rank === 2 ? 'second-place' : rank === 3 ? 'third-place' : '';
            
            const rankDisplay = rank <= 3 ? medals[rank - 1] : `#${rank}`;
            
            let scoreDisplay = modeId === 'survival' 
                ? `${entry.score} correct` 
                : `${entry.score}/${entry.total}`;
            
            const percentDisplay = entry.percentage ? `<span class="score-percentage">${entry.percentage}%</span>` : '';
            const streakDisplay = entry.streak ? `<span class="streak-badge">🔥 ${entry.streak} streak</span>` : '';
            
            const date = new Date(entry.date);
            const dateStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            return `
                <div class="score-entry ${entryClass}" style="animation-delay: ${index * 0.1}s">
                    <div class="rank ${rankClass}">${rankDisplay}</div>
                    <div class="score-info">
                        <div class="score-value">
                            ${scoreDisplay}
                            ${percentDisplay}
                            ${streakDisplay}
                        </div>
                        <div class="score-date">${dateStr}</div>
                    </div>
                </div>
            `;
        }

        function filterMode(mode) {
            currentFilter = mode;
            
            // Update tab buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event?.target?.classList.add('active');

            // Filter boards
            const boards = document.querySelectorAll('.mode-leaderboard');
            boards.forEach(board => {
                if (mode === 'all' || board.dataset.mode === mode) {
                    board.classList.add('active');
                } else {
                    board.classList.remove('active');
                }
            });
        }

        // Load on page load
        loadLeaderboard();
        
        // Auto-refresh every 30 seconds
        setInterval(loadLeaderboard, 30000);
    </script>
</body>
</html>
