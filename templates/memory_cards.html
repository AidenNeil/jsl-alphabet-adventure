<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Match - JSL Alphabet Adventure</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .home-btn {
            padding: 12px 25px;
            background: white;
            color: #333;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .home-btn:hover {
            transform: translateY(-2px);
        }
        
        .stats-panel {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .stat-box {
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .card {
            aspect-ratio: 3/4;
            position: relative;
            cursor: pointer;
            perspective: 1000px;
        }
        
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        
        .card.matched .card-inner {
            opacity: 0.6;
            pointer-events: none;
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .card-back {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .card-front {
            background: white;
            transform: rotateY(180deg);
            padding: 10px;
        }
        
        .card-front.letter-card {
            font-size: 4rem;
            color: #333;
        }
        
        .card-front.image-card img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            border-radius: 10px;
        }
        
        .card-back::before {
            content: "🧠";
            font-size: 3rem;
        }
        
        .results-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .results-overlay.show {
            display: flex;
        }
        
        .results-card {
            background: white;
            padding: 50px;
            border-radius: 25px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: popIn 0.5s ease-out;
        }
        
        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .results-emoji {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        
        .results-title {
            font-size: 2.5rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .results-stats {
            font-size: 1.2rem;
            color: #666;
            margin: 20px 0;
        }
        
        .results-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            color: #333;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            .card-face {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <a href="/memory" class="home-btn">← Back</a>
            
            <div class="stats-panel">
                <div class="stat-box">
                    <div class="stat-label">Time</div>
                    <div class="stat-value" id="timer">0:00</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Moves</div>
                    <div class="stat-value" id="moves">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Matches</div>
                    <div class="stat-value" id="matches">0/6</div>
                </div>
            </div>
        </div>
        
        <div class="cards-grid" id="cardsGrid"></div>
    </div>
    
    <div class="results-overlay" id="resultsOverlay">
        <div class="results-card">
            <div class="results-emoji">🎉</div>
            <h2 class="results-title">Congratulations!</h2>
            <div class="results-stats">
                <p>Time: <strong id="finalTime">0:00</strong></p>
                <p>Moves: <strong id="finalMoves">0</strong></p>
                <p>Matches: <strong id="finalMatches">0</strong></p>
            </div>
            <div class="results-buttons">
                <button class="btn btn-primary" onclick="restartGame()">🔄 Play Again</button>
                <button class="btn btn-secondary" onclick="goHome()">🏠 Home</button>
            </div>
        </div>
    </div>

    <script>
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timerInterval = null;
        let seconds = 0;
        let canFlip = true;

        // Select 6 random letters for the game
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        let selectedLetters = [];

        async function initGame() {
            // Select 6 random letters
            selectedLetters = [];
            const shuffled = [...alphabet].sort(() => Math.random() - 0.5);
            selectedLetters = shuffled.slice(0, 6);
            
            // Create card pairs (letter + image for each)
            cards = [];
            selectedLetters.forEach((letter, index) => {
                cards.push({
                    id: `letter-${index}`,
                    type: 'letter',
                    value: letter,
                    matched: false
                });
                cards.push({
                    id: `image-${index}`,
                    type: 'image',
                    value: letter,
                    matched: false
                });
            });
            
            // Shuffle cards
            cards.sort(() => Math.random() - 0.5);
            
            renderCards();
            startTimer();
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            
            cards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.dataset.index = index;
                cardElement.onclick = () => flipCard(index);
                
                const cardInner = document.createElement('div');
                cardInner.className = 'card-inner';
                
                const cardBack = document.createElement('div');
                cardBack.className = 'card-face card-back';
                
                const cardFront = document.createElement('div');
                cardFront.className = `card-face card-front ${card.type}-card`;
                
                if (card.type === 'letter') {
                    cardFront.textContent = card.value;
                } else {
                    const img = document.createElement('img');
                    img.src = `/src/jsl_alphabet_test/${card.value}.jpg`;
                    img.alt = `JSL ${card.value}`;
                    cardFront.appendChild(img);
                }
                
                cardInner.appendChild(cardBack);
                cardInner.appendChild(cardFront);
                cardElement.appendChild(cardInner);
                grid.appendChild(cardElement);
            });
        }

        function flipCard(index) {
            if (!canFlip) return;
            
            const card = cards[index];
            const cardElement = document.querySelectorAll('.card')[index];
            
            if (card.matched || cardElement.classList.contains('flipped')) {
                return;
            }
            
            cardElement.classList.add('flipped');
            flippedCards.push({ index, card, element: cardElement });
            
            playFlipSound();
            vibrateDevice(50);
            
            if (flippedCards.length === 2) {
                canFlip = false;
                moves++;
                document.getElementById('moves').textContent = moves;
                
                setTimeout(checkMatch, 800);
            }
        }

        function checkMatch() {
            const [first, second] = flippedCards;
            
            if (first.card.value === second.card.value && first.card.type !== second.card.type) {
                // Match found!
                first.card.matched = true;
                second.card.matched = true;
                first.element.classList.add('matched');
                second.element.classList.add('matched');
                
                matchedPairs++;
                document.getElementById('matches').textContent = `${matchedPairs}/6`;
                
                playMatchSound();
                vibrateDevice([100, 50, 100]);
                
                if (matchedPairs === 6) {
                    setTimeout(showResults, 500);
                }
            } else {
                // No match
                first.element.classList.remove('flipped');
                second.element.classList.remove('flipped');
                
                playWrongSound();
                vibrateDevice(200);
            }
            
            flippedCards = [];
            canFlip = true;
        }

        function startTimer() {
            seconds = 0;
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                document.getElementById('timer').textContent = 
                    `${mins}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function showResults() {
            stopTimer();
            
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            const timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;
            
            document.getElementById('finalTime').textContent = timeStr;
            document.getElementById('finalMoves').textContent = moves;
            document.getElementById('finalMatches').textContent = matchedPairs;
            document.getElementById('resultsOverlay').classList.add('show');
            
            playSuccessSound();
            
            // Save score
            saveScore();
        }

        async function saveScore() {
            await fetch('/api/save-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    mode: 'memory_cards', 
                    score: matchedPairs, 
                    total: 6,
                    extra: { moves, time: seconds }
                })
            });
        }

        function restartGame() {
            document.getElementById('resultsOverlay').classList.remove('show');
            matchedPairs = 0;
            moves = 0;
            flippedCards = [];
            canFlip = true;
            stopTimer();
            document.getElementById('moves').textContent = '0';
            document.getElementById('matches').textContent = '0/6';
            initGame();
        }

        function goHome() {
            window.location.href = '/';
        }

        // Sound effects
        function playFlipSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 400;
            gain.gain.value = 0.1;
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        }

        function playMatchSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            [523.25, 659.25, 783.99].forEach((freq, i) => {
                osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
            });
            gain.gain.value = 0.15;
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
        }

        function playWrongSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 200;
            gain.gain.value = 0.1;
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }

        function playSuccessSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.15);
            });
            gain.gain.value = 0.15;
            osc.start();
            osc.stop(ctx.currentTime + 0.7);
        }

        // Vibration feedback
        function vibrateDevice(pattern) {
            if ('vibrate' in navigator) {
                navigator.vibrate(pattern);
            }
        }

        // Initialize game on load
        initGame();
    </script>
</body>
</html>
