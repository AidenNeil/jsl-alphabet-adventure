<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Blitz - JSL Alphabet Adventure</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        
        .game-container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .home-btn {
            padding: 12px 25px;
            background: white;
            color: #333;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .stats-panel {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .stat-box {
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff0844, #ffb199);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .game-card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .sign-image-container {
            width: 100%;
            max-width: 350px;
            height: 350px;
            margin: 0 auto 20px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .sign-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .letter-input {
            width: 120px;
            height: 120px;
            font-size: 5rem;
            text-align: center;
            border: 5px solid #ff0844;
            border-radius: 20px;
            background: #f8f8f8;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
            outline: none;
            margin: 20px auto;
            display: block;
        }
        
        .letter-input:focus {
            border-color: #ffb199;
            box-shadow: 0 0 30px rgba(255, 8, 68, 0.5);
            background: white;
        }
        
        .letter-input.correct {
            border-color: #4ade80;
            background: #d1fae5;
        }
        
        .letter-input.incorrect {
            border-color: #ef4444;
            background: #fee2e2;
            animation: shake 0.3s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .timer-big {
            font-size: 4rem;
            font-weight: bold;
            color: #ff0844;
            margin: 20px 0;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .combo-banner {
            font-size: 2rem;
            font-weight: bold;
            color: #ff0844;
            margin: 15px 0;
            min-height: 40px;
        }
        
        .leaderboard-sidebar {
            position: fixed;
            right: 20px;
            top: 20px;
            width: 250px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        
        .leaderboard-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ff0844;
            text-align: center;
        }
        
        .leaderboard-entry {
            padding: 10px;
            margin-bottom: 8px;
            background: #f0f0f0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .leaderboard-entry.top-1 {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            font-weight: bold;
        }
        
        .leaderboard-entry.top-2 {
            background: linear-gradient(135deg, #e0e0e0, #f0f0f0);
        }
        
        .leaderboard-entry.top-3 {
            background: linear-gradient(135deg, #cd7f32, #d4926e);
        }
        
        .results-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .results-overlay.show {
            display: flex;
        }
        
        .results-card {
            background: white;
            padding: 50px;
            border-radius: 25px;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .results-emoji {
            font-size: 6rem;
            margin-bottom: 20px;
        }
        
        .results-title {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff0844, #ffb199);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .final-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 30px 0;
        }
        
        .final-stat {
            padding: 20px;
            background: #f0f0f0;
            border-radius: 15px;
        }
        
        .final-stat-value {
            font-size: 3rem;
            font-weight: bold;
            color: #ff0844;
        }
        
        .final-stat-label {
            font-size: 1rem;
            color: #666;
        }
        
        .results-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ff0844, #ffb199);
            color: white;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        @media (max-width: 1200px) {
            .leaderboard-sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <a href="/speed" class="home-btn">← Back</a>
            
            <div class="stats-panel">
                <div class="stat-box">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Streak</div>
                    <div class="stat-value" id="streak">0</div>
                </div>
            </div>
        </div>
        
        <div class="game-card">
            <div class="timer-big" id="timer">60</div>
            
            <div class="sign-image-container">
                <img id="signImage" src="" alt="JSL Sign" class="sign-image">
            </div>
            
            <div class="combo-banner" id="comboBanner"></div>
            
            <input 
                type="text" 
                class="letter-input" 
                id="letterInput" 
                maxlength="1" 
                autocomplete="off"
                autofocus
                placeholder="?"
            >
            <p style="color: #999;">Type letters as fast as you can!</p>
        </div>
    </div>
    
    <div class="leaderboard-sidebar">
        <div class="leaderboard-title">🏆 TOP PLAYERS</div>
        <div id="leaderboardList"></div>
    </div>
    
    <div class="results-overlay" id="resultsOverlay">
        <div class="results-card">
            <div class="results-emoji">🚀</div>
            <h2 class="results-title">TIME'S UP!</h2>
            
            <div class="final-stats">
                <div class="final-stat">
                    <div class="final-stat-value" id="finalScore">0</div>
                    <div class="final-stat-label">Letters Typed</div>
                </div>
                <div class="final-stat">
                    <div class="final-stat-value" id="finalStreak">0</div>
                    <div class="final-stat-label">Best Streak</div>
                </div>
                <div class="final-stat">
                    <div class="final-stat-value" id="finalAccuracy">0%</div>
                    <div class="final-stat-label">Accuracy</div>
                </div>
                <div class="final-stat">
                    <div class="final-stat-value" id="finalRank">#-</div>
                    <div class="final-stat-label">Global Rank</div>
                </div>
            </div>
            
            <div class="results-buttons">
                <button class="btn btn-primary" onclick="restartGame()">🔄 Play Again</button>
                <button class="btn btn-secondary" onclick="goHome()">🏠 Home</button>
            </div>
        </div>
    </div>

    <script>
        let score = 0;
        let streak = 0;
        let bestStreak = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let currentLetter = null;
        let totalAttempts = 0;
        let correctAttempts = 0;
        let isPlaying = false;

        const letterInput = document.getElementById('letterInput');
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

        async function startGame() {
            score = 0;
            streak = 0;
            bestStreak = 0;
            timeLeft = 60;
            totalAttempts = 0;
            correctAttempts = 0;
            isPlaying = true;
            
            updateDisplay();
            loadNextSign();
            startTimer();
            loadLeaderboard();
        }

        function loadNextSign() {
            if (!isPlaying) return;
            
            const randomLetter = alphabet[Math.floor(Math.random() * alphabet.length)];
            currentLetter = randomLetter;
            
            document.getElementById('signImage').src = `/src/jsl_alphabet_test/${randomLetter}.jpg`;
            letterInput.value = '';
            letterInput.className = 'letter-input';
            letterInput.focus();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                
                if (timeLeft <= 10) {
                    document.getElementById('timer').style.color = '#ef4444';
                }
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        letterInput.addEventListener('input', function(e) {
            if (!isPlaying) return;
            
            const answer = e.target.value.toUpperCase();
            if (!answer) return;
            
            totalAttempts++;
            
            if (answer === currentLetter) {
                handleCorrect();
            } else {
                handleIncorrect();
            }
            
            setTimeout(loadNextSign, 200);
        });

        function handleCorrect() {
            letterInput.className = 'letter-input correct';
            playCorrectSound();
            vibrateDevice(50);
            
            score++;
            streak++;
            correctAttempts++;
            
            if (streak > bestStreak) {
                bestStreak = streak;
            }
            
            updateDisplay();
            
            if (streak >= 5) {
                const banner = document.getElementById('comboBanner');
                banner.textContent = `🔥 ${streak}x COMBO! 🔥`;
                banner.style.animation = 'pulse 0.5s infinite';
            }
        }

        function handleIncorrect() {
            letterInput.className = 'letter-input incorrect';
            playIncorrectSound();
            vibrateDevice(100);
            
            streak = 0;
            updateDisplay();
            document.getElementById('comboBanner').textContent = '';
        }

        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
        }

        async function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            letterInput.disabled = true;
            
            const accuracy = totalAttempts > 0 ? Math.round((correctAttempts / totalAttempts) * 100) : 0;
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalStreak').textContent = bestStreak;
            document.getElementById('finalAccuracy').textContent = accuracy + '%';
            
            // Save score and get rank
            const response = await fetch('/api/speed-blitz/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    score,
                    streak: bestStreak,
                    accuracy
                })
            });
            const data = await response.json();
            
            document.getElementById('finalRank').textContent = '#' + data.rank;
            document.getElementById('resultsOverlay').classList.add('show');
            
            playSuccessSound();
            await loadLeaderboard();
        }

        async function loadLeaderboard() {
            const response = await fetch('/api/speed-blitz/leaderboard');
            const data = await response.json();
            
            const container = document.getElementById('leaderboardList');
            container.innerHTML = data.slice(0, 10).map((entry, index) => {
                const rank = index + 1;
                const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
                const className = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';
                
                return `
                    <div class="leaderboard-entry ${className}">
                        <span>${medal}</span>
                        <span style="font-weight: bold;">${entry.score}</span>
                    </div>
                `;
            }).join('');
        }

        function restartGame() {
            document.getElementById('resultsOverlay').classList.remove('show');
            letterInput.disabled = false;
            document.getElementById('timer').style.color = '#ff0844';
            startGame();
        }

        function goHome() {
            window.location.href = '/';
        }

        function vibrateDevice(duration) {
            if ('vibrate' in navigator) {
                navigator.vibrate(duration);
            }
        }

        function playCorrectSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 600;
            gain.gain.value = 0.1;
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        }

        function playIncorrectSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 150;
            gain.gain.value = 0.1;
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        }

        function playSuccessSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
            });
            gain.gain.value = 0.15;
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        }

        // Auto-refresh leaderboard every 10 seconds
        setInterval(loadLeaderboard, 10000);
        
        // Start game on load
        startGame();
    </script>
</body>
</html>
